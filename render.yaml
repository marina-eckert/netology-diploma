services:
  - type: web
    name: netology-diploma
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HTTP_HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: UPLOAD_STORAGE
        value: database
      - key: SEED_DEMO
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        sync: false
