services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library_local}
      POSTGRES_DB: ${POSTGRES_DB:-library}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20
  app:
    build: .
    ports:
      - "${HTTP_HOST:-127.0.0.1}:${HTTP_PORT:-3000}:3000"
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library_local}
      POSTGRES_DB: ${POSTGRES_DB:-library}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Library123!}
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-disk}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:
